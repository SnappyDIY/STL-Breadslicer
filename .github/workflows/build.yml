name: Build and Test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        id: install
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

